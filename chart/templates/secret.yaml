{{- if include "dash0edge.createSecret" . }}
{{- /*
One key, the raw token. The composite header strings the Edge Proxy needs are
built at pod start from $(DASH0_TOKEN), so the token never appears in a
Deployment manifest and an existingSecret only has to hold the token itself.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dash0edge.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dash0edge.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.dash0.token.value | quote }}
{{- end }}
